<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Fynd Boltic customer support hero graphic</title>
  <desc id="desc">Fynd Boltic styled hero graphic featuring AI workflow automation for customer support.</desc>
  <defs>
