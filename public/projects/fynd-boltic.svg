  <text x="390" y="168" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="600" fill="#ff5a2f">New</text>
  <text x="454" y="168" font-family="Manrope, Arial, sans-serif" font-size="18" fill="#333842">Be the first to unlock seamless API workflows with Fynd Boltic Gateway</text>

  <rect x="450" y="214" width="220" height="54" rx="27" fill="#f5f5f5" stroke="#e2e2e2"/>
