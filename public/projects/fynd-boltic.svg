  <text x="380" y="390" font-family="Manrope, Arial, sans-serif" font-size="72" font-weight="700" fill="#101318">AI Workflow Automation for</text>
  <text x="505" y="480" font-family="Manrope, Arial, sans-serif" font-size="84" font-weight="700" fill="url(#accent)">Customer Support</text>

  <text x="450" y="548" font-family="Manrope, Arial, sans-serif" font-size="24" fill="#6a727c">Streamline your support processes with intelligent automation that saves</text>
  <text x="676" y="584" font-family="Manrope, Arial, sans-serif" font-size="24" fill="#6a727c">time and reduces costs</text>

  <rect x="650" y="618" width="130" height="46" rx="10" fill="#fff" stroke="#ff8e72"/>
