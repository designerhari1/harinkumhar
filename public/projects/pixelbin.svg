<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Pixelbin.io project graphic</title>
  <desc id="desc">Professional graphic for Pixelbin media API and image transformation platform.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f9fb"/>
      <stop offset="1" stop-color="#eceff4"/>
    </linearGradient>
    <linearGradient id="tile1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fa0b5"/>
      <stop offset="1" stop-color="#64798f"/>
    </linearGradient>
    <linearGradient id="tile2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9d3df"/>
      <stop offset="1" stop-color="#95a5b8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#202427" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="1000" height="1000" rx="34" fill="#ffffff" stroke="#d9dee6"/>
  </g>

  <rect x="150" y="152" width="900" height="150" rx="24" fill="#f5f7fa" stroke="#dbe1e9"/>
  <text x="190" y="246" font-family="Newsreader, Georgia, serif" font-size="88" fill="#202427">pixelbin.io</text>

  <g>
    <rect x="150" y="352" width="274" height="274" rx="22" fill="url(#tile1)"/>
    <rect x="463" y="352" width="274" height="274" rx="22" fill="url(#tile2)"/>
    <rect x="776" y="352" width="274" height="274" rx="22" fill="url(#tile1)"/>

    <rect x="150" y="665" width="274" height="274" rx="22" fill="url(#tile2)"/>
    <rect x="463" y="665" width="274" height="274" rx="22" fill="url(#tile1)"/>
    <rect x="776" y="665" width="274" height="274" rx="22" fill="url(#tile2)"/>
  </g>

  <g fill="#f5f8fd" font-family="Manrope, Arial, sans-serif" font-size="30" font-weight="600">
    <text x="188" y="510">Resize</text>
    <text x="500" y="510">Format</text>
    <text x="813" y="510">Compress</text>
    <text x="188" y="822">Smart Crop</text>
    <text x="500" y="822">CDN Cache</text>
    <text x="813" y="822">AI Effects</text>
  </g>

  <text x="154" y="1026" font-family="Manrope, Arial, sans-serif" font-size="34" fill="#5e6875">Image and video pipelines for modern product teams</text>
</svg>
